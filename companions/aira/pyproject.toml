[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aira-phone-cli"
version = "0.1.0"
description = "Command-line client for Aira's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
aira = "aira_cli:main"

[tool.setuptools]
py-modules = ["aira_cli", "aira_notifications"]
packages = ["aira_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
aira_desk = ["*.html", "*.css", "*.js", "aira-logo.png"]
