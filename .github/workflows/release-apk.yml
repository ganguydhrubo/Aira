name: Release APK

# Manual: build the optimised APK and publish it as a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.52"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build optimised APK
        run: ./gradlew :app:assemblePerf --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/perf/*.apk | head -1)
          cp "$apk" Aira.apk
          sha256sum Aira.apk > SHA256SUMS.txt
          gh release create "$TAG" Aira.apk SHA256SUMS.txt \
            --title "Aira $TAG" \
            --notes "Download **Aira.apk** below and open it on your Android phone (Android 10 or later) to install."
