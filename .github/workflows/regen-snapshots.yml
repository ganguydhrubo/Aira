name: Regenerate snapshots (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:test --tests '*LoopScenarioTest' --tests '*PromptSurfaceTest' -PupdateSnapshots
      - uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: |
            core/src/test/resources/loop-snapshots
            core/src/test/resources/prompt-surface
