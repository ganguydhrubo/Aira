name: PR policy

# A PR from a fork must have "Allow edits by maintainers" checked, so maintainers can add fixes directly on the PR branch and merge (see CONTRIBUTING).
# This check fails when it is not checked. Checking it does not start a new run: after checking it, push a commit or ask a maintainer to re-run this check.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  maintainer-edits:
    name: maintainer edits allowed
    # Maintainers can already edit PRs from branches in the same repository, so no check is needed
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check "Allow edits by maintainers"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # Fetch the PR's current state instead of the old value in the event, so a re-run sees the option if the author checked it later
        run: |
          set -euo pipefail
          read -r allowed owner_type < <(gh api "repos/$REPO/pulls/$PR" --jq '"\(.maintainer_can_modify) \(.head.repo.owner.type)"')
          if [ "$allowed" = "true" ]; then
            echo "Maintainers can push to this PR branch."
            exit 0
          fi
          if [ "$owner_type" = "Organization" ]; then
            # GitHub does not offer this option for organization-owned forks, so we cannot require it; only warn
            echo "::warning::This PR comes from an organization-owned fork, where GitHub does not offer \"Allow edits by maintainers\". A maintainer may need to open a separate PR to make fixes."
            exit 0
          fi
          {
            echo "### \"Allow edits by maintainers\" is off"
            echo
            echo "Please check **Allow edits by maintainers** in the right sidebar of this PR, then push a commit or ask a maintainer to re-run this check."
            echo "This lets a maintainer add small fixes on top of your commits and merge, instead of opening a separate PR. See CONTRIBUTING.md."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::\"Allow edits by maintainers\" is off. Check it in the PR sidebar so maintainers can push fixes to this branch."
          exit 1
